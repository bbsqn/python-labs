name: Lab 10 Production CI

on:
  push:
    branches:
      - main
    paths:
      - "Lab_10/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "Lab_10/**"
      - ".github/workflows/ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Lab_10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: |
          ruff check .

      - name: Ruff format check
        run: |
          ruff format --check .

      - name: Type check (mypy)
        run: |
          mypy src tests

      - name: Run tests with coverage
        run: |
          pytest -v --cov=bank_account_service --cov-report=term-missing

      - name: Build package (wheel and sdist)
        run: |
          python -m build
          ls -la dist

      - name: Verify Docker build and health endpoint
        if: matrix.python-version == '3.12'
        run: |
          docker build -t bank-account-service:ci .
          docker run -d --name bank-api-ci -p 8000:8000 -e ENVIRONMENT=production bank-account-service:ci
          for i in 1 2 3 4 5; do
            curl -fsS http://127.0.0.1:8000/health && break || sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health || { docker logs bank-api-ci; exit 1; }
          docker stop bank-api-ci
