[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "reliable-importer"
version = "0.1.0"
description = "Laboratory work 5: Error handling, files, and serialization"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Зінчук Остап" }
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "flake8>=7.0",
    "pytest>=8.0",
    "pyyaml>=6.0",
    "reportlab>=4.2",
    "pypdf>=4.0"
]

[project.scripts]
reliable-importer = "reliable_importer.main:main"
bank-importer = "reliable_importer.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true

[tool.setuptools.packages.find]
where = ["src"]
