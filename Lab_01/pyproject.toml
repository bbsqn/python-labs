[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-system"
version = "0.1.0"
description = "Laboratory work for Professional Python"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Зінчук Остап" }
]

[project.scripts]
bank-system = "bank_system.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
