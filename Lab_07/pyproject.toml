[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-system"
version = "0.7.0"
description = "Laboratory work 7: Working with databases in Python (Variant 4: Bank Account System)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Зінчук Остап" }
]
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "flake8>=7.0",
    "reportlab>=4.2",
    "pypdf>=4.0",
]

[project.scripts]
bank-system = "bank_system.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -v"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true

[tool.setuptools.packages.find]
where = ["src"]
